<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Reviews Admin</title>
<style>
  :root { --bg:#121210; --ink:#E9E5DB; --dim:#A9A499; --faint:#6F6B62; --line:rgba(233,229,219,.16); --brass:#C4A265; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:Georgia,serif; padding:48px 20px; }
  .wrap { max-width:860px; margin:0 auto; }
  h1 { font-weight:400; font-size:1.7rem; margin-bottom:6px; }
  .sub { font-family:Menlo,monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--brass); margin-bottom:36px; }
  .card { border:1px solid var(--line); padding:22px; margin-bottom:18px; }
  .meta { font-family:Menlo,monospace; font-size:11px; color:var(--faint); letter-spacing:.08em; line-height:2; }
  .meta b { color:var(--brass); font-weight:400; }
  blockquote { font-size:1.02rem; line-height:1.7; color:var(--dim); margin:14px 0; font-style:italic; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button, input[type=password] { font-family:Menlo,monospace; font-size:12px; letter-spacing:.1em; }
  button { background:none; border:1px solid var(--line); color:var(--ink); padding:9px 16px; cursor:pointer; }
  button:hover { border-color:var(--brass); color:var(--brass); }
  button.approve { border-color:#3a5a40; color:#7fb98a; }
  button.reject { border-color:#5a3a3a; color:#c98a8a; }
  .status { font-family:Menlo,monospace; font-size:10px; letter-spacing:.15em; text-transform:uppercase; padding:3px 8px; border:1px solid var(--line); }
  .st-approved { color:#7fb98a; } .st-rejected { color:#c98a8a; } .st-pending { color:var(--brass); }
  input[type=password] { width:100%; background:none; border:1px solid var(--line); color:var(--ink); padding:12px; margin:14px 0; }
  .msg { font-family:Menlo,monospace; font-size:12px; color:var(--dim); margin-top:10px; min-height:16px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Reviews Admin</h1>
      <p class="sub">Moderation · approve before publish</p>
    </div>
    <button id="logout" style="display:none">Log out</button>
  </div>

  <div id="loginBox">
    <input type="password" id="pw" placeholder="admin password" autocomplete="current-password" />
    <button id="loginBtn">Unlock</button>
    <p class="msg" id="loginMsg"></p>
  </div>

  <div id="list"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);

async function load() {
  const r = await fetch("/api/admin/reviews");
  if (r.status === 401) { showLogin(); return; }
  const items = await r.json();
  $("#loginBox").style.display = "none";
  $("#logout").style.display = "inline-block";
  const list = $("#list");
  list.innerHTML = "";
  if (!items.length) { list.innerHTML = '<p class="msg">No submissions yet.</p>'; return; }
  for (const it of items) {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <div class="meta">
        <b>#${it.id}</b> · <span class="status st-${it.status}">${it.status}</span> · ${it.created_at} UTC<br>
        ${it.name} · ${it.company || "—"} · ${it.relation}<br>
        ${it.email}
      </div>
      <blockquote>"${it.body.replace(/</g,"&lt;")}"</blockquote>
      <div class="row">
        <button class="approve" data-id="${it.id}" data-a="approve">Approve</button>
        <button class="reject" data-id="${it.id}" data-a="reject">Reject</button>
        <button data-id="${it.id}" data-a="pending">Unpublish</button>
      </div>`;
    list.appendChild(div);
  }
  list.querySelectorAll("button[data-id]").forEach((b) =>
    b.addEventListener("click", async () => {
      b.disabled = true;
      await fetch("/api/admin/action", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ id: +b.dataset.id, action: b.dataset.a }),
      });
      load();
    })
  );
}

function showLogin() {
  $("#logout").style.display = "none";
  $("#loginBox").style.display = "block";
}

$("#loginBtn").addEventListener("click", async () => {
  const r = await fetch("/api/admin/login", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ password: $("#pw").value }),
  });
  if (r.ok) { $("#loginMsg").textContent = ""; load(); }
  else $("#loginMsg").textContent = "Wrong password.";
});
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#loginBtn").click(); });
$("#logout").addEventListener("click", async () => {
  await fetch("/api/admin/logout", { method: "POST" });
  showLogin();
});

load();
</script>
</body>
</html>
